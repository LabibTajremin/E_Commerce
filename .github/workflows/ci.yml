name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-secret
      STRIPE_SECRET_KEY: sk_test_fake
      STRIPE_WEBHOOK_SECRET: whsec_fake
      S3_BUCKET: test-bucket
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Type-check (mypy)
        run: mypy src
      - name: Migration upgrade/downgrade round-trip
        run: |
          docker run -d --name pg-ci -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=test -p 5432:5432 postgres:16-alpine
          until docker exec pg-ci pg_isready -U postgres; do sleep 1; done
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          docker stop pg-ci && docker rm pg-ci
      - name: Run test suite (unit + integration + e2e)
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=90

  frontend-test:
    strategy:
      matrix:
        app: [admin-dashboard, storefront]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run test

  deploy-preview:
    needs: [backend-test, frontend-test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g vercel
      - run: vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --cwd backend
      - run: vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --cwd admin-dashboard
      - run: vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --cwd storefront

  deploy-production:
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g vercel
      - run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd backend
      - run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd admin-dashboard
      - run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd storefront
