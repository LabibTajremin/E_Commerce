[project]
name = "ecommerce-backend"
version = "0.1.0"
description = "Multi-tenant e-commerce SaaS platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "redis==5.2.1",
    "celery==5.4.0",
    "boto3==1.35.90",
    "stripe==11.4.1",
    "httpx==0.28.1",
    "structlog==24.4.0",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "testcontainers[postgres,redis]==4.9.0",
    "polyfactory==2.18.1",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "pre-commit==4.0.1",
    "aiosqlite==0.20.0",
    "types-python-jose==3.3.4.20240106",
    "types-passlib==1.7.7.20241221",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py"]
